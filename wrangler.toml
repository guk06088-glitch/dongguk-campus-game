name = "dongguk-campus-game"
main = "src/index.js"
compatibility_date = "2026-11-04"

[assets]
directory = "./public"
binding = "ASSETS"
# SECURITY: all requests, including static assets, must be checked by the Worker.
run_worker_first = true

[[durable_objects.bindings]]
name = "CAMPUS_ROOM"
class_name = "CampusRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CampusRoom"]
