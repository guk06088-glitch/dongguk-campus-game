<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>동국 3D 연결 진단</title><style>body{font:16px/1.7 system-ui,sans-serif;margin:0;padding:24px;background:#eef5f0;color:#111}main{max-width:620px;margin:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:15px;border:1px solid #bbb;border-radius:10px}button,a{font-size:16px;padding:10px}b{color:#183f2e}</style><main><h1>동국 3D 연결 진단</h1><p>진단 버전: DGU-20261105-R3</p><p>아래 결과를 캡처해서 보내주세요. 게임 자체는 <a href="/">홈 화면</a>에서 실행합니다.</p><button id="run">다시 검사</button><pre id="log">검사 준비 중…</pre></main><script type="module">const log=document.querySelector('#log');async function run(){let lines=['페이지: '+location.href,'브라우저: '+navigator.userAgent,'HTTPS: '+(location.protocol==='https:'),'시간: '+new Date().toISOString()];try{let c=document.createElement('canvas'),gl=c.getContext('webgl2')||c.getContext('webgl');lines.push('WebGL: '+(gl?'사용 가능':'사용 불가'));if(gl){lines.push('WebGL 버전: '+gl.getParameter(gl.VERSION));}}catch(e){lines.push('WebGL 오류: '+e.message)}for(let u of ['https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js','https://unpkg.com/three@0.170.0/build/three.module.js','https://esm.sh/three@0.170.0']){try{let m=await Promise.race([import(u),new Promise((_,reject)=>setTimeout(()=>reject(Error('10초 초과')),10000))]);lines.push('Three.js '+u+': 성공 ('+m.REVISION+')');break}catch(e){lines.push('Three.js '+u+': 실패 ('+e.message+')')}}log.textContent=lines.join('\n')}document.querySelector('#run').onclick=run;run();</script></html>
