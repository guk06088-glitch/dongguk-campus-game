<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><meta name="theme-color" content="#162a27"><title>동국대학교 대학원 | 7개 전공 탐험 RPG R13.32</title><style>
:root{font-family:'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;color:#fef4de;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0;overflow:hidden;background:#08140f}button,select{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #eac275;outline-offset:2px}
#game{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;background:#192d24;isolation:isolate}
#scene{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}
.hud{position:absolute;inset:0;pointer-events:none}
.interactive,.hud button{pointer-events:auto}
.top{position:absolute;left:12px;right:12px;top:max(9px,env(safe-area-inset-top));display:flex;align-items:flex-start;gap:9px;justify-content:space-between}
.brand{border:1px solid #d0ab6e;background:#1d3028e9;box-shadow:0 3px 0 #11241e,0 10px 18px #0006;border-radius:11px;padding:7px 11px;max-width:32%;min-width:152px;min-height:45px}
.brand b{font-size:13px;color:#ffe2a5;display:block;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.brand small{font-size:10px;color:#dddfc7;white-space:nowrap;display:block;text-overflow:ellipsis;overflow:hidden;margin-top:3px}
.mission{flex:1;max-width:45%;border:1px solid #d0aa68;background:#142820e8;box-shadow:0 10px 20px #0005;border-radius:11px;padding:7px 12px;min-width:140px}
.mission .tag{color:#ffe0a0;font-size:11px;font-weight:900}.mission #questLine{font-size:12px;line-height:1.4;margin-top:2px;color:#fff6e8;max-height:34px;overflow:hidden}.mission .track{height:4px;border-radius:4px;background:#ffffff2a;margin-top:5px;overflow:hidden}.mission .track>i{display:block;width:0;height:100%;background:#f0c66d;transition:width .2s}
.tbuttons{display:flex;gap:5px}.tbuttons button{background:#1e342be8;color:#fff0d1;border:1px solid #e0be87;border-radius:10px;min-width:48px;min-height:44px;padding:4px 8px;font-size:11px;font-weight:800;box-shadow:0 5px 12px #0005}.tbuttons button span{display:block;font-size:19px;line-height:22px}
.minimap{position:absolute;right:12px;top:69px;width:130px;height:91px;border-radius:10px;background:#11261adf;border:2px solid #c5a66f;box-shadow:0 7px 16px #0005;overflow:hidden}.minimap canvas{width:100%;height:100%;image-rendering:pixelated}
.controls{position:absolute;inset:auto 0 0 0;height:140px;pointer-events:none}.joystick{pointer-events:auto;touch-action:none;width:112px;height:112px;border-radius:50%;position:absolute;left:max(20px,env(safe-area-inset-left));bottom:max(15px,env(safe-area-inset-bottom));border:3px solid #dbc48e99;background:radial-gradient(#ffe8b530,#132b24a6 75%);box-shadow:inset 0 0 20px #0006,0 7px 14px #0006;display:grid;place-items:center}.joystick:before{content:'✣';font-size:47px;opacity:.23;color:#ffe7b3}.stick{position:absolute;left:50%;top:50%;width:50px;height:50px;transform:translate(-50%,-50%);border-radius:50%;background:linear-gradient(#fff3c8,#bc9752);border:3px solid #866c3e;box-shadow:inset 0 3px 5px #fff5,0 4px 10px #0006;pointer-events:none}
.action-row{pointer-events:auto;position:absolute;right:max(17px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));display:flex;align-items:end;gap:9px}
.action-row button{width:70px;height:70px;border-radius:19px;border:2px solid #eacb91;background:linear-gradient(145deg,#517061e8,#183b32e9);color:#fff8de;font-weight:900;box-shadow:0 5px 0 #0a211a,0 8px 15px #0006;font-size:12px}.action-row button .emoji{font-size:26px;display:block}.action-row .primary{height:82px;width:82px;border-radius:50%;background:linear-gradient(145deg,#daae68,#74491e);font-size:13px}
.hint{position:absolute;bottom:13px;left:50%;transform:translateX(-50%);font-size:10px;padding:6px 11px;border-radius:30px;background:#10261bd7;border:1px solid #e9c98955;white-space:nowrap;color:#e5d6ae;pointer-events:none}
.toast{position:absolute;left:50%;bottom:133px;transform:translate(-50%,20px);max-width:80%;padding:10px 17px;border-radius:12px;background:#10291feb;border:1px solid #e3c57d;color:#fff3d0;font-size:13px;text-align:center;box-shadow:0 10px 30px #0008;opacity:0;transition:opacity .16s,transform .16s;pointer-events:none}.toast.on{opacity:1;transform:translate(-50%,0)}
#modal{position:absolute;inset:0;background:#06100bb9;display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(2px);pointer-events:auto}#modal.open{display:flex}
.panel{width:min(690px,96%);max-height:min(90%,500px);overflow-y:auto;background:linear-gradient(145deg,#faf2da,#ead8b8);color:#243d30;border:3px solid #977345;box-shadow:0 0 0 4px #30271e,0 22px 60px #000b;border-radius:17px;padding:20px 22px;position:relative}.panel .eyebrow{letter-spacing:.12em;font-weight:900;color:#946529;font-size:11px}.panel h2{font-size:clamp(18px,2.5vw,25px);margin:8px 30px 10px 0;line-height:1.35;word-break:keep-all}.panel p{font-size:14px;line-height:1.7;margin:8px 0 14px;white-space:pre-wrap;word-break:keep-all}.panel .close{position:absolute;right:10px;top:9px;border:0;background:#e5d2ab;color:#3c3425;border-radius:10px;width:36px;height:36px;font-weight:900;font-size:20px}.choices{display:grid;gap:9px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}.choices button{background:#fffaf0;color:#2a4436;text-align:left;border:1px solid #c5a16b;padding:11px 13px;border-radius:11px;font-size:13px;font-weight:750;min-height:42px}.choices button:hover,.choices button:focus-visible{background:#f4dea7}.choices button[disabled]{opacity:.5;cursor:default}
.reading{border-left:4px solid #bca365;padding:9px 11px;background:#f6ead3;font-size:12px;line-height:1.6;margin:9px 0 13px}.progress-badges{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}.progress-badges span{background:#dfebd6;padding:4px 9px;border:1px solid #96b388;border-radius:30px;font-size:12px}
#start{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;background:linear-gradient(90deg,#081812e8,#153b30bc),radial-gradient(ellipse at 80% 40%,#8ea24d,#163c31 65%);padding:22px;pointer-events:auto;overflow-y:auto}
.startcard{text-align:center;width:min(650px,100%);background:#10271bdc;border:2px solid #d1af73;border-radius:21px;padding:22px;box-shadow:0 20px 60px #0008}.startcard .mark{font-size:45px}.startcard h1{font-size:clamp(24px,3.3vw,36px);line-height:1.25;margin:7px 0 9px;color:#ffe4ab}.startcard p{font-size:13px;line-height:1.75;color:#dfdfc7;max-width:460px;margin:0 auto 15px}.start-buttons{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}.start-buttons button{border-radius:13px;padding:13px 18px;background:#f4d698;color:#314335;border:2px solid #e7b468;font-weight:900;min-width:180px;box-shadow:0 5px 0 #614b2c}.start-buttons button.alt{background:#26483b;color:#f8ebca}
#rotateNote{position:absolute;left:50%;top:14px;transform:translateX(-50%);color:#fff4cd;background:#182f22d9;border:1px solid #d8b57b;padding:7px 10px;border-radius:30px;font-size:11px;white-space:nowrap;pointer-events:none;display:none;z-index:11}
@media(orientation:portrait){#game{width:100dvh;height:100vw;left:100vw;top:0;right:auto;bottom:auto;transform-origin:top left;transform:rotate(90deg)}#rotateNote{display:block}}
@media(max-height:530px){.top{top:5px}.brand{min-height:38px;padding:5px 8px}.brand b{font-size:12px}.brand small{font-size:9px}.mission{padding:5px 9px}.mission #questLine{font-size:11px}.minimap{top:58px;width:115px;height:75px}.controls{height:112px}.joystick{width:90px;height:90px;bottom:10px}.stick{width:43px;height:43px}.action-row{bottom:10px}.action-row button{width:61px;height:61px}.action-row .primary{width:69px;height:69px}.hint{bottom:4px;font-size:9px}.panel{max-height:95%;padding:12px 16px}.panel p{font-size:12px;margin:5px 0 8px}.choices button{padding:8px 10px;min-height:34px}.toast{bottom:102px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(orientation:portrait){
 .top{top:5px}.brand{min-height:36px;padding:5px 8px}.brand b{font-size:12px}.brand small{font-size:9px}
 .mission{padding:5px 9px}.mission #questLine{font-size:11px}.minimap{top:58px;width:112px;height:74px}
 .controls{height:105px}.joystick{width:87px;height:87px;bottom:9px}.stick{width:42px;height:42px}
 .action-row{bottom:9px}.action-row button{width:61px;height:61px}.action-row .primary{width:68px;height:68px}
 .hint{bottom:3px;font-size:9px}.panel{max-height:95%;padding:12px 16px}.panel p{font-size:12px;margin:5px 0 8px}
 .choices button{padding:8px 10px;min-height:34px}.toast{bottom:105px}
}

/* R13.32: keep touch HUD readable on short landscape screens. */
@media (max-height:430px) and (orientation:landscape){
 .brand{max-width:23%;min-width:127px}.mission{max-width:48%}
 .minimap{top:55px;right:10px;width:104px;height:70px}
 .hint{display:none}.toast{bottom:100px;font-size:12px}
 .tbuttons button{min-height:43px;min-width:43px;font-size:10px;padding:3px 6px}
 .action-row{gap:8px}.action-row button{width:57px;height:57px}.action-row .primary{width:68px;height:68px}
 .joystick{width:86px;height:86px}.stick{width:40px;height:40px}
}

<div id="game">

<div id="start"><div class="startcard"><div class="mark">🏮📚</div><h1>동국대학교 대학원<br>전공 탐험 RPG</h1><p>가로형 2D 도트 세계에서 직접 움직이고, NPC를 만나 단서를 수집하고, 선택에 따라 다른 결말을 완성하세요. 7개 전공 · 반복 생성 사건 · 브라우저 저장.</p><div class="start-buttons"><button id="easy">🌱 쉬움 · 길 안내</button><button id="normal" class="alt">🧭 보통 · 자유 탐험</button><button id="hard" class="alt">📜 어려움 · 탐구 강화</button></div><p style="margin-top:14px;font-size:11px">이 버전은 오프라인 규칙 기반 사건 조합을 사용합니다. 서버 생성형 AI는 연결되지 않았습니다. 전투·채팅 기능은 없습니다.</p></div></div>
<div id="rotateNote">↻ 가로 화면으로 돌리면 더 넓게 플레이할 수 있습니다.</div>
</div>

  let legacy=[];

 }catch{return {stamps:{},runs:{}}}
}

// Breadth-first route finding with a safety gap; no fake auto-navigation.
function findPath(tx,ty,interactAfter=false){

 // A destination beside an NPC is sufficient. For ordinary taps, the requested tile
 // must be free (or the nearest free tile within one step); do not walk through walls.
 const desired=(x,y)=>interactAfter?Math.hypot((x+.5)*T-tx,(y+.5)*T-ty)<=70:Math.abs(x-gx)+Math.abs(y-gy)<=1;

 for(let qi=0;qi<queue.length;qi++){
  const [x,y]=queue[qi],distance=Math.hypot((x+.5)*T-tx,(y+.5)*T-ty);

  if(desired(x,y)&&good(x,y)){found=[x,y];break}
  for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
   const nx=x+dx,ny=y+dy,k=`${nx},${ny}`;
   if(visited.has(k)||!good(nx,ny))continue;
   visited.set(k,[x,y]);queue.push([nx,ny]);

  // but never claim success for a point inside a large blocked region.
  if(!interactAfter&&best&&bestDistance<=T*1.3)found=best;

}
function moveBy(dx,dy,dt){const p=HUD.player,w=HUD.world,mag=Math.hypot(dx,dy);if(mag<.1)return false;const speed=(HUD.mode==='hard'?145:160)*dt;dx=dx/mag*speed;dy=dy/mag*speed;
